<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}夜班接驳车时刻工具{% endblock %}</title>
  <style>
    :root { --ink:#1f2933; --muted:#667085; --brand:#1d4ed8; --ok-bg:#ecfdf3;
            --ok-bd:#12b76a; --warn-bg:#fffaeb; --warn-bd:#f79009;
            --err-bg:#fef3f2; --err-bd:#f04438; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC",
           system-ui, sans-serif; color:var(--ink); background:#f5f7fb; }
    header { background:var(--brand); color:#fff; padding:20px 28px; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:6px 0 0; font-size:13px; opacity:.85; }
    nav { margin-top:10px; font-size:13px; }
    nav a { color:#dbe7ff; margin-right:16px; text-decoration:none; }
    nav a.active { color:#fff; font-weight:700; text-decoration:underline; }
    main { max-width:980px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid #e4e7ec; border-radius:10px;
            padding:20px 24px; margin-bottom:20px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; }
    .grid .full { grid-column: 1 / -1; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
    input, textarea { width:100%; padding:9px 10px; border:1px solid #d0d5dd;
            border-radius:8px; font-size:14px; font-family:inherit; }
    textarea { min-height:88px; resize:vertical; line-height:1.7; }
    input:focus, textarea:focus { outline:2px solid #b2ccff; border-color:var(--brand); }
    button { margin-top:16px; background:var(--brand); color:#fff; border:0;
             padding:10px 26px; border-radius:8px; font-size:15px; cursor:pointer; }
    button:hover { background:#1e40af; }
    .banner { border-radius:8px; padding:12px 16px; margin-bottom:16px; font-size:14px;
              border:1px solid; }
    .banner.err { background:var(--err-bg); border-color:var(--err-bd); }
    .banner.warn { background:var(--warn-bg); border-color:var(--warn-bd); }
    .banner.ok { background:var(--ok-bg); border-color:var(--ok-bd); }
    .banner ul { margin:6px 0 0 18px; padding:0; }
    .answer { font-size:16px; line-height:1.9; }
    .answer .trip { font-size:26px; font-weight:700; color:var(--brand); }
    table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
    th, td { border:1px solid #e4e7ec; padding:7px 9px; text-align:left;
             vertical-align:top; }
    th { background:#f9fafb; }
    code { background:#f2f4f7; padding:1px 6px; border-radius:4px; font-size:12px; }
    .muted { color:var(--muted); font-size:12px; }
    h2 { font-size:16px; margin:18px 0 10px; }
    a { color:var(--brand); word-break:break-all; }
    .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px;
           font-weight:600; white-space:nowrap; }
    .tag.confirmed { background:var(--err-bg); color:#b42318; border:1px solid var(--err-bd); }
    .tag.review { background:var(--warn-bg); color:#b54708; border:1px solid var(--warn-bd); }
    .tag.ok { background:var(--ok-bg); color:#027a48; border:1px solid var(--ok-bd); }
    .tag.fail { background:var(--err-bg); color:#b42318; border:1px solid var(--err-bd); }
  </style>
</head>
<body>
<header>
  <h1>夜班接驳车时刻工具</h1>
  <p>{% block subtitle %}{% endblock %}</p>
  <nav>
    <a href="{{ url_for('index') }}"
       class="{{ 'active' if request.endpoint == 'index' else '' }}">末班核定</a>
    <a href="{{ url_for('quality_check') }}"
       class="{{ 'active' if request.endpoint == 'quality_check' else '' }}">线路时刻质检</a>
  </nav>
</header>
<main>
  {% block body %}{% endblock %}
  <p class="muted">页面生成时间：{{ now }}</p>
</main>
</body>
</html>
